[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nullaudit"
version = "0.1.0"
description = "NullAudit implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.2", "psutil>=5.9", "Pillow>=10","torchvision>=0.17","numpy>=1.24","scipy>=1.11","matplotlib>=3.7","scikit-learn>=1.3","scikit-image>=0.22"]

[project.scripts]
nullaudit = "nullaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

